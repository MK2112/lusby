<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <allow send_destination="org.lusby.Daemon"
           send_interface="org.lusby.Daemon"
           send_member="get_policy_status"/>
    <allow send_destination="org.lusby.Daemon"
           send_interface="org.lusby.Daemon"
           send_member="list_devices"/>
    <allow send_destination="org.lusby.Daemon"
           send_interface="org.lusby.Daemon"
           send_member="request_ephemeral_allow"/>
    <allow send_destination="org.lusby.Daemon"
           send_interface="org.lusby.Daemon"
           send_member="revoke_device"/>
    <allow send_destination="org.lusby.Daemon"
           send_interface="org.freedesktop.DBus.Introspectable"
           send_member="Introspect"/>
    <allow send_destination="org.lusby.Daemon"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow receive_sender="org.lusby.Daemon"
           receive_interface="org.lusby.Daemon"/>
  </policy>

  <policy user="root">
    <allow own="org.lusby.Daemon"/>
    <allow send_destination="org.lusby.Daemon"
           send_interface="org.lusby.Daemon"/>
    <allow receive_sender="org.lusby.Daemon"/>
  </policy>
</busconfig>
