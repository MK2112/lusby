<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <allow send_destination="org.lusby.Daemon"
           send_interface="org.lusby.Daemon"
           send_member="GetPolicyStatus"/>
    <allow send_destination="org.lusby.Daemon"
           send_interface="org.lusby.Daemon"
           send_member="GetPolicyStatusString"/>
    <allow send_destination="org.lusby.Daemon"
           send_interface="org.lusby.Daemon"
           send_member="ListDevices"/>
    <allow send_destination="org.lusby.Daemon"
           send_interface="org.lusby.Daemon"
           send_member="GetDeviceInfo"/>
    <allow send_destination="org.lusby.Daemon"
           send_interface="org.lusby.Daemon"
           send_member="RequestEphemeralAllow"/>
    <allow send_destination="org.lusby.Daemon"
           send_interface="org.lusby.Daemon"
           send_member="RevokeDevice"/>
    <allow send_destination="org.lusby.Daemon"
           send_interface="org.freedesktop.DBus.Introspectable"
           send_member="Introspect"/>
    <allow send_destination="org.lusby.Daemon"
           send_interface="org.freedesktop.DBus.Properties"
           send_member="Get"/>
    <allow receive_sender="org.lusby.Daemon"
           receive_interface="org.lusby.Daemon"/>
  </policy>

  <policy user="root">
    <allow own="org.lusby.Daemon"/>
    <allow send_destination="org.lusby.Daemon"
           send_interface="org.lusby.Daemon"/>
    <allow receive_sender="org.lusby.Daemon"/>
  </policy>
</busconfig>
