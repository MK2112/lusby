[lib]
name = "lusby_daemon"
path = "src/lib.rs"
[package]
name = "lusby-daemon"
version = "0.1.1"
edition = "2021"
license = "Apache-2.0"
description = "Lusby privileged daemon for managing usbguard policies and signed baselines"
authors = ["MK2112 <mk2112@protonmail.com>"]

[features]
default = []
udev-monitor = ["dep:udev"]

[dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json", "time"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "net"] }
zbus = { version = "4", default-features = false, features = ["tokio"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lusby-common = { path = "../common" }
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
lusby-backend-usbguard = { path = "../backend-usbguard" }
udev = { version = "0.8", optional = true }
libc = "0.2"
ed25519-dalek = "2"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.22"

[dev-dependencies]
lusby-backend-mock = { path = "../backend-mock" }
proptest = "1.0"
tempfile = "3"

[package.metadata.deb]
maintainer = "MK2112 <mk2112@protonmail.com>"
section = "utils"
priority = "optional"
depends = "$auto, usbguard (>= 1.0.0), polkitd | policykit-1, udev, libgtk-3-0, libayatana-appindicator3-1 | libappindicator3-1"
recommends = "apparmor"
assets = [
    ["target/release/lusby-daemon", "usr/sbin/lusby-daemon", "755"],
    ["target/release/lusbyctl", "usr/bin/lusbyctl", "755"],
    ["target/release/lusby-tray", "usr/bin/lusby-tray", "755"],
    ["../../packaging/dbus/org.lusby.Daemon.conf", "etc/dbus-1/system.d/org.lusby.Daemon.conf", "644"],
    ["../../packaging/dbus/system-services/org.lusby.Daemon.service", "usr/share/dbus-1/system-services/org.lusby.Daemon.service", "644"],
    ["../../packaging/polkit/org.lusby.manage.policy", "usr/share/polkit-1/actions/org.lusby.manage.policy", "644"],
    ["../../packaging/apparmor/usr.sbin.lusby-daemon", "etc/apparmor.d/usr.sbin.lusby-daemon", "644"],
    ["../../packaging/config/config.toml", "etc/lusby/config.toml", "644"],
    ["../../packaging/udev/80-lusby.rules", "etc/udev/rules.d/80-lusby.rules", "644"],
    ["../../packaging/desktop/lusby-tray.desktop", "etc/xdg/autostart/lusby-tray.desktop", "644"],
    ["../../packaging/desktop/lusby-tray.desktop", "usr/share/applications/lusby-tray.desktop", "644"],
    ["../../README.md", "usr/share/doc/lusby-daemon/README.md", "644"],
    ["../../LICENSE", "usr/share/doc/lusby-daemon/LICENSE", "644"],
]
maintainer-scripts = "../../packaging/debian"
systemd-units = { unit-scripts = "../../packaging/systemd", unit-name = "lusby-daemon" }
